note: >-
  The published contract models identity and authorization only. No patient, clinician, session,
  prescription, outcome or device entity appears in it, even though those are the objects XRHealth's
  product manages - they live behind the invitation-only XRH Developer portal. This ERD therefore
  describes the door, not the building.
