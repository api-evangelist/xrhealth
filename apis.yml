apis:
- name: XRHealth Platform API
  description: >-
    First-party REST API for XRHealth applications and approved integrations, published as OpenAPI
    3.1.0 at https://api.xr.health/v1/openapi.json. The document currently describes the platform
    authentication module: passwordless (one-time email code) patient login for server-side
    applications holding an X-XRHealth-Application-Token, a PKCE public-client variant for native
    and browser clients, refresh-token rotation and revocation, a /me subject endpoint, and a JWKS
    endpoint publishing the public signing keys for XRHealth patient access tokens.
  humanURL: https://developer.xr.health/
