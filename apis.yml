aid: xrhealth
name: XRHealth
description: >-
  XRHealth is an extended-reality (XR) therapeutics and virtual-clinic company, founded in 2016 with
  offices in Boston, Massachusetts and Tel Aviv, Israel, that delivers FDA-registered and CE-marked
  virtual and augmented reality treatment for physical rehabilitation, cognitive training, pain
  management and mental health. Patients receive VR headsets at home and work with licensed
  clinicians through the XRHealth Virtual Clinic, while therapists use the XRHealth platform to
  prescribe applications, review session telemetry and track outcomes. The company merged with
  Amelia Virtual Care in 2023 to form one of the largest XR therapeutics platforms. Its programmable
  surface is the XRHealth Platform API on api.xr.health — a first-party OpenAPI 3.1 contract covering
  passwordless patient authentication, PKCE public-client token exchange, refresh-token rotation and
  JWKS key publication — plus an invitation-only XRH Developer portal for approved integrations.
