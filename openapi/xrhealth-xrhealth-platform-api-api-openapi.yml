openapi: 3.2.0
info:
  title: XRHealth Platform API
  version: 1.0.0
  description: Common API for XRHealth applications and approved integrations.
servers:
- url: /v1
tags:
- name: XRHealth Platform API
paths:
  /:
    get:
      operationId: getApiMetadata
      summary: Get API metadata
      responses:
        '200':
          description: API metadata
      tags:
      - XRHealth Platform API
components:
  securitySchemes:
    applicationToken:
      type: apiKey
      in: header
      name: X-XRHealth-Application-Token
    patientBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
