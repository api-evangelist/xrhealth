  grade: documented
  credit: 0.4
  write_surface:
  - operation: verifyPatientPasswordlessLogin
    effect: 'Issues a patient access token and a refresh token.'
    reversal_operation: revokePatientToken
    reversal_effect: 'The refresh token is no longer usable.'
    window: null
    window_source: null
  - operation: exchangePublicPatientToken
    effect: 'Issues a public-client access token and refresh token from a PKCE authorization code, or rotates an existing refresh token.'
    reversal_operation: revokePublicPatientToken
    reversal_effect: 'The refresh token is no longer usable.'
    window: null
    window_source: null
  - operation: refreshPatientToken
    effect: 'Rotates a patient refresh token.'
    reversal_operation: revokePatientToken
    reversal_effect: 'The refresh token is no longer usable.'
    window: null
    window_source: null
  - operation: startPatientPasswordlessLogin
    effect: 'Sends a one-time login code to a patient email address.'
    reversal_operation: null
    reversal_effect: 'None. An email that has been sent cannot be recalled.'
    window: null
    window_source: null
  - operation: startPublicPatientPasswordlessLogin
    effect: 'Sends a one-time login code to a patient email address for a registered public client.'
    reversal_operation: null
    reversal_effect: 'None.'
    window: null
    window_source: null
  irreversible:
  - operation: revokePatientToken
    note: 'Revocation itself is terminal; there is no un-revoke operation. Recovery is a fresh passwordless login.'
  - operation: revokePublicPatientToken
    note: 'Terminal; no un-revoke operation.'
  note: >-
    GRADED "documented", not "verified": a reversal path genuinely exists for every token-issuing
    write (revoke undoes a grant), but XRHealth states NO window for it anywhere. The token lifetimes
    that appear in the contract - expires_in 900 and refresh_token_expires_in 2592000 - are OpenAPI
    "example" values on TokenResponse, not a published policy, so they are recorded here as evidence
    of shape and deliberately NOT written into window:. Inventing a 30-day reversal window from an
    example integer is exactly the error this field exists to prevent. Two of the five write
    operations - the two that send email to a patient - have no reversal at all.
