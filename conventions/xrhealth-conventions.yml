  openapi/xrhealth-platform-openapi.yml plus live request/response observation on
  https://api.xr.health/v1/ and https://api.xr.health/v1/me on 2026-09-04
authentication:
  style: two-credential
  application_credential:
    scheme: apiKey
    location: header
    name: X-XRHealth-Application-Token
    applies_to: [startPatientPasswordlessLogin, verifyPatientPasswordlessLogin, refreshPatientToken, revokePatientToken, getCurrentPatient]
  patient_credential:
    scheme: http bearer
    format: JWT
    verification: 'Public keys published at https://api.xr.health/v1/.well-known/jwks.json (getPatientApiJwks)'
  public_client_flow:
    description: >-
      Registered public clients (native and browser apps) use a client_id plus PKCE instead of the
      application token: start and verify passwordless login, receive a short-lived authorization
      code, then exchange it at /auth/public/token with a code_verifier.
    pkce: 'required, code_challenge_method enum is [S256] only'
  cross_link: authentication/xrhealth-authentication.yml
versioning:
  style: uri-path
  current: v1
  cross_link: lifecycle/xrhealth-lifecycle.yml
idempotency:
  supported: false
  coverage: none
  header: null
  evidence: >-
    No Idempotency-Key (or equivalent) parameter, header or request-body field appears anywhere in
    the published contract, and no idempotency guidance is published on any readable XRHealth
    surface. All ten write operations are POSTs with no replay protection.
  note: >-
    The consequences are concrete rather than theoretical for this contract: a retried
    startPatientPasswordlessLogin sends a patient a second one-time code, and a retried
    exchangePublicPatientToken re-presents an authorization code that the server is expected to
    treat as single-use, so a duplicate is a failure rather than a no-op. An agent must therefore
    treat every retry here as a new side effect.
