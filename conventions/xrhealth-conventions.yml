request_tracing:
  supported: true
  request_header: null
  response_header: x-request-id
  body_field: request_id
  cors_exposed: true
  evidence: >-
    Observed live on https://api.xr.health/v1/ and /v1/me: every response carries x-request-id, and
    access-control-expose-headers: x-request-id makes it readable to browser clients. Error bodies
    repeat the same value as request_id. This is the strongest runtime convention in the contract
    and the value to quote to XRHealth support.
  aws_headers: 'x-amzn-requestid and x-amz-apigw-id are also present (AWS API Gateway), but x-request-id is the XRHealth-owned identifier.'
