note: >-
  Every named path was probed on every host this record knows and NONE returned a document. Three
  distinct walls were observed and are recorded verbatim below rather than collapsed: (1)
  www.xr.health and xr.health sit behind a SiteGround "sgcaptcha" JavaScript robot challenge that
  answers HTTP 202 with a 169-222 byte meta-refresh shell for EVERY path, including a
  negative-control path that cannot exist - so no 202 on that host is a hit; (2) api.xr.health is an
  AWS API Gateway that answers 403 with a fixed JSON error stub for every path outside /v1, again
  including the negative control; (3) developer.xr.health and platform.xr.health (Next.js on Vercel)
  return real 404s. No WellKnown and no SecurityTxt pointer is emitted, because the provider serves
  none of these documents. XRHealth DOES publish a JWKS, but at the API-versioned path
  https://api.xr.health/v1/.well-known/jwks.json, which is an operation in its OpenAPI
  (getPatientApiJwks) rather than a host-root discovery document; it is recorded in
  authentication/xrhealth-authentication.yml, not here.
